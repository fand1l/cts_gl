<script>
/* The theme and the language, before the first paint.  See index.html. */
(function () {
  var root = document.documentElement;
  try {
    var theme = localStorage.getItem('cts-theme');
    if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme);
  } catch (error) {}

  var locale = 'en_US';
  try {
    var chosen = sessionStorage.getItem('cts-lang');
    if (chosen === 'en_US' || chosen === 'uk_UA') locale = chosen;
  } catch (error) {}
  root.setAttribute('data-lang', locale);
  root.setAttribute('data-i18n-pending', '');

  window.CTS = window.CTS || {};
  try {
    window.CTS.strings = fetch('i18n/' + locale + '.json').then(function (answer) {
      if (!answer.ok) throw new Error(answer.status);
      return answer.json();
    });
  } catch (error) {}
})();
</script>
